services:
  - type: web
    name: taskiller-api
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /health/ready
    envVars:
      - key: TASKILLER_ENV
        value: production

      - key: TASKILLER_DATABASE_URL
        sync: false

      - key: TASKILLER_JWT_SECRET
        generateValue: true

      - key: TASKILLER_TOKEN_HASH_SECRET
        generateValue: true

      - key: TASKILLER_EMBEDDED_WORKER_ENABLED
        value: "true"

      - key: TASKILLER_EMAIL_DELIVERY_MODE
        value: mailjet

      - key: TASKILLER_WEB_APP_URL
        value: https://taskiller-web.vercel.app

      - key: TASKILLER_MAILJET_API_KEY
        sync: false

      - key: TASKILLER_MAILJET_SECRET_KEY
        sync: false

      - key: TASKILLER_MAILJET_FROM_EMAIL
        sync: false

      - key: TASKILLER_MAILJET_FROM_NAME
        value: Taskiller

      - key: TASKILLER_CORS_ORIGINS
        sync: false

      - key: TASKILLER_ALLOWED_HOSTS
        sync: false

      - key: TASKILLER_TRUST_FORWARDED_FOR
        value: "true"

      - key: TASKILLER_REFRESH_COOKIE_SECURE
        value: "true"

      - key: TASKILLER_REFRESH_COOKIE_SAMESITE
        value: none

      - key: TASKILLER_LOG_LEVEL
        value: INFO
