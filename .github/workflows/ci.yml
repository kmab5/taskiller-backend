name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: taskiller_test
          POSTGRES_USER: taskiller
          POSTGRES_PASSWORD: taskiller
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskiller -d taskiller_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TASKILLER_ENV: test
      TASKILLER_DATABASE_URL: postgresql+psycopg://taskiller:taskiller@localhost:5432/taskiller_test
      TASKILLER_TEST_DATABASE_URL: postgresql+psycopg://taskiller:taskiller@localhost:5432/taskiller_test
      TASKILLER_DJANGO_SECRET_KEY: ci-django-secret-ci-django-secret-ci
      TASKILLER_EMAIL_DELIVERY_MODE: safe_log
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          version: "latest-known"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/taskiller-runtime.txt
          uvx --from pip-audit pip-audit --requirement /tmp/taskiller-runtime.txt --require-hashes --no-deps --disable-pip

      - name: Compile
        if: ${{ !cancelled() }}
        run: uv run python -m compileall -q src tests scripts manage.py

      - name: Lint
        if: ${{ !cancelled() }}
        run: uv run ruff check .

      - name: Format check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: uv run pyright

      - name: Django migrate
        if: ${{ !cancelled() }}
        run: PYTHONPATH=src uv run python manage.py migrate --noinput

      - name: Migration drift
        if: ${{ !cancelled() }}
        run: PYTHONPATH=src uv run python manage.py makemigrations --check --dry-run

      - name: Django system check
        if: ${{ !cancelled() }}
        run: PYTHONPATH=src uv run python manage.py check

      - name: Final Django audit
        if: ${{ !cancelled() }}
        run: PYTHONPATH=src uv run python scripts/django_phase10_final_audit.py

      - name: Cutover contract
        if: ${{ !cancelled() }}
        run: PYTHONPATH=src uv run python scripts/django_phase8_cutover_check.py

      - name: Static admin contract freshness
        if: ${{ !cancelled() }}
        run: |
          uv run python scripts/build_admin_contract.py --check
          uv run python docs/tools/build_data.py --check

      - name: Baseline audit
        if: ${{ !cancelled() }}
        run: PYTHONPATH=src uv run python scripts/django_phase9_baseline_audit.py

      - name: Collect Django static files
        if: ${{ !cancelled() }}
        run: PYTHONPATH=src uv run python manage.py collectstatic --noinput

      - name: Production-shaped smoke
        if: ${{ !cancelled() }}
        run: PYTHONPATH=src uv run python scripts/django_phase9_production_smoke.py

      - name: Domain and worker smoke checks
        if: ${{ !cancelled() }}
        run: |
          uv run python scripts/django_phase3_auth_smoke.py
          uv run python scripts/django_phase4_work_smoke.py
          uv run python scripts/django_phase5_focus_smoke.py
          uv run python scripts/django_phase6_execution_smoke.py
          uv run python scripts/django_phase7_smoke.py

      - name: Tests
        if: ${{ !cancelled() }}
        run: uv run pytest --cov=taskiller --cov-report=term-missing --cov-report=xml

      - name: Release contract
        if: ${{ !cancelled() }}
        run: PYTHONPATH=src uv run python scripts/release_check.py

      - name: Build container
        run: docker build -t taskiller-backend:ci .

      - name: Import production image
        run: >-
          docker run --rm taskiller-backend:ci
          python -c "import django, taskiller; print(django.get_version(), taskiller.__version__)"
