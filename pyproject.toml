[project]
name = "taskiller-backend"
version = "0.2.0"
description = "Taskiller API backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.128,<0.129",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.14,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.3,<1",
  "email-validator>=2.3,<3",
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "uvicorn[standard]>=0.48,<0.49",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pyright>=1.1,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskiller"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a PostgreSQL database",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["alembic"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
