[project]
name = "taskiller-backend"
version = "1.0.0"
description = "Taskiller API backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "django>=5.2.18,<5.3",
  "djangorestframework>=3.18.1,<3.19",
  "drf-spectacular>=0.30,<0.31",
  "whitenoise>=6,<7",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.14,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.3,<1",
  "email-validator>=2.3,<3",
  "uvicorn[standard]>=0.48,<0.49",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pyright>=1.1,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskiller"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a PostgreSQL database",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
# Phase 10: until Pyright-compatible typing is added to the dynamically defined
# Django ORM models and DRF request classes, type-check only framework-neutral
# algorithm and request-schema modules. This is intentionally partial coverage.
# All Django API/ORM/worker modules are still checked via Ruff, manage.py check,
# migration drift, pytest and the Django integration smoke steps in CI.
include = [
  "src/taskiller/analytics/derive.py",
  "src/taskiller/analytics/schemas.py",
  "src/taskiller/focus/engine.py",
  "src/taskiller/focus/schemas.py",
  "src/taskiller/execution/schemas.py",
  "src/taskiller/work/schemas.py",
  "src/taskiller/auth/security.py",
  "src/taskiller/core/time.py",
  "src/taskiller/operations/tokens.py",
  "src/taskiller/users/etag.py",
]
exclude = ["legacy_backend", "tests"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
